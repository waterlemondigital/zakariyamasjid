name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Backend to Vercel
        run: |
          cd backend
          npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        run: |
          cd frontend
          npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  deploy-admin:
    name: Deploy Trustee Admin Panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Admin to Vercel
        run: |
          cd admin
          npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
